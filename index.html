.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px;color:#fff}
.dial{width:26px;height:26px;border-radius:50%;border:3px solid var(--sun);position:relative}
.dial::before,.dial::after{content:"";position:absolute;left:50%;bottom:50%;width:3px;background:var(--sun);transform-origin:bottom;border-radius:2px}
.dial::before{height:8px;transform:translateX(-50%)}
.dial::after{height:6px;transform:translateX(-50%) rotate(90deg)}
.lang{display:flex;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;color:rgba(255,255,255,.8);font:600 14px/1 inherit;padding:8px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.hero h1{font-size:clamp(32px,9vw,54px);font-weight:800;letter-spacing:-.02em;margin:26px 0 12px;max-width:15em}
.lead{margin:0 0 16px;color:rgba(255,255,255,.82);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.08);color:#fff;font:600 16px/1 inherit;padding:12px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#16242c}
.answer{background:#fff;color:#16242c;border-radius:18px;padding:18px 18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.answer .body{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer strong{display:block;font-size:18px;line-height:1.3;margin-bottom:4px}
.answer .todo{color:#465861;font-size:15px;line-height:1.45}
.answer .pr{text-align:right;min-width:92px}
.answer .pr small{display:block;font-size:13px;color:#56666f;line-height:1.2}
.answer .pr b{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;color:#0d5570;line-height:1.1;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:15px 24px;border-radius:14px}
.btn svg{width:22px;height:22px;flex:none}
.answer .btn{width:100%;margin-top:14px}
.promise{display:flex;flex-wrap:wrap;gap:6px 18px;margin:16px 0 0;padding:0;list-style:none;font-size:14px;color:rgba(255,255,255,.88)}
.promise li::before{content:"✓ ";color:var(--sun);font-weight:700}

/* ---------- price board ---------- */
main{padding-top:34px}
section{margin:0 0 46px}
section>h2,.board h2{font-size:27px;margin-bottom:6px}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}
.board{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px 18px}
.row{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:13px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.row:last-of-type{border-bottom:0}
.row .name{font-weight:500}
.row .name small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.row .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-5px);min-width:16px}
.row .price{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;white-space:nowrap;color:var(--sea)}
.row:hover .name{text-decoration:underline}
.deal{margin-top:12px;background:var(--sun);color:#16242c;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* ---------- content ---------- */
.steps{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.steps b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ice);color:var(--sea);font-family:"Bricolage Grotesque",sans-serif;font-size:20px}
.steps strong{display:block}
.steps span{color:var(--muted);font-size:15px}
.why{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.why div{background:var(--ice);border-radius:14px;padding:14px 16px}
.why strong{display:block;margin-bottom:2px}
.why span{color:var(--muted);font-size:14px;line-height:1.45;display:block}
@media (max-width:420px){.why{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block}
.gallery figcaption{font-size:14px;font-weight:600;margin-top:6px}
.office{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;align-items:center;background:var(--ice);border-radius:18px;overflow:hidden}
.office img{width:100%;height:100%;object-fit:cover;display:block;min-height:220px}
.office div{padding:18px 18px 18px 0}
.office h2{font-size:22px;margin-bottom:6px}
.office p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:560px){.gallery{grid-template-columns:1fr 1fr}.gallery figure:last-child{grid-column:span 2}.gallery figure:last-child img{aspect-ratio:16/10}.office{grid-template-columns:1fr}.office div{padding:0 18px 18px}}
.areas{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none;margin:0}
.areas li{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{font-weight:600;cursor:pointer}
details p{color:var(--muted);margin:8px 0 0}
.end{background:var(--navy);color:#fff;border-radius:20px;padding:28px 22px;text-align:center}
.end h2{font-size:26px;margin-bottom:8px}
.end p{margin:0 0 20px;color:rgba(255,255,255,.8)}
footer{border-top:1px solid var(--line);padding:24px 0 12px;color:var(--muted);font-size:14px}

/* ---------- sticky bar ---------- */
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;transform:translateY(110%);transition:transform .25s}
.sticky.show{transform:none}
.sticky .btn{width:100%;max-width:680px}

const fmtPrice = p => p.startsWith("from ") ? (lang==="zh" ? p.slice(5)+" "+t("from") : t("from")+" "+p.slice(5)) : p;

function renderAnswer(){

  watchHero();
}
function renderChips(){
  const c = document.getElementById("chips");

  c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{sym=b.dataset.s; renderChips(); renderAnswer();});
}
function renderRows(){

  }).join("");
  document.querySelectorAll(".row").forEach(b=>b.onclick=()=>{
    const s=SERVICES.find(x=>x.id===b.dataset.s);
    window.open(waUrl(t("was").replace("{s}",s[lang][0])),"_blank","noopener");
  });
}
let io;
function watchHero(){
  const btn=document.getElementById("heroBtn"), bar=document.getElementById("sticky");
  if(!("IntersectionObserver" in window)){bar.classList.add("show");return}
  if(io) io.disconnect();
  io=new IntersectionObserver(([e])=>bar.classList.toggle("show",!e.isIntersecting),{threshold:0});
  io.observe(btn);
}
function render(){
  document.documentElement.lang = lang==="zh"?"zh-Hans":lang;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t(el.dataset.t)});

}
